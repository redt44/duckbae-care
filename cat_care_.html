<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다혜 & 대준이의 덕배 돌봄 일지 🐱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cat: {
                            50: '#fffaf5',
                            100: '#fef3e7',
                            200: '#fce3c7',
                            300: '#f9cca0',
                            400: '#f4a96e',
                            500: '#ee833f',
                            600: '#e06524',
                            700: '#ba4b1c',
                            800: '#943c1d',
                            900: '#78331b'
                        },
                        dahye: {
                            light: '#ffe4e6',
                            DEFAULT: '#fb7185',
                            dark: '#e11d48'
                        },
                        daejoon: {
                            light: '#e0f2fe',
                            DEFAULT: '#38bdf8',
                            dark: '#0284c7'
                        }
                    },
                    fontFamily: {
                        gowun: ['"Gowun Dodum"', 'sans-serif'],
                        sans: ['"Noto Sans KR"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .font-gowun {
            font-family: 'Gowun Dodum', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .btn-bounce {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
    <div id="app" class="max-w-md md:max-w-2xl mx-auto px-4 pt-4 pb-20">
        
        <!-- Header & Profile Bar -->
        <header class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 mb-5 relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 text-cat-100 opacity-60 text-9xl pointer-events-none select-none">
                <i class="fa-solid font-bold fa-cat"></i>
            </div>
            
            <div class="relative z-10 flex items-center justify-between mb-4">
                <div>
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-cat-100 text-cat-700">
                        <i class="fa-solid fa-heart text-cat-500"></i> 다혜 & 대준 공동 케어
                    </span>
                    <h1 class="text-2xl font-bold font-gowun text-slate-800 mt-1 flex items-center gap-2">
                        덕배 돌봄 일지 🐾
                    </h1>
                </div>
                <div id="connection-status" class="flex items-center gap-1.5 text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-100">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>실시간 동기화</span>
                </div>
            </div>

            <!-- Profile Selector -->
            <div class="bg-slate-100 p-1.5 rounded-2xl flex items-center gap-1 text-sm font-semibold">
                <button id="btn-user-dahye" onclick="selectUser('다혜')" class="flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 shadow-sm bg-white text-rose-600 font-bold border border-rose-100">
                    <span class="text-base">👩‍🦰</span> 다혜 (아내)
                </button>
                <button id="btn-user-daejoon" onclick="selectUser('대준')" class="flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 text-slate-500 hover:text-slate-700">
                    <span class="text-base">👨‍🦱</span> 대준 (남편)
                </button>
            </div>
        </header>

        <!-- Quick Status Overview Cards -->
        <section class="grid grid-cols-3 gap-2.5 mb-5">
            <!-- Feed Status -->
            <div class="bg-white p-3.5 rounded-2xl border border-amber-100 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-xs text-amber-700 font-medium mb-1">
                    <span>🍚 밥주기</span>
                    <i class="fa-solid fa-utensils opacity-40"></i>
                </div>
                <div id="status-feed-time" class="text-sm font-bold text-slate-800 truncate">기록 없음</div>
                <div id="status-feed-user" class="text-[11px] text-slate-400 mt-1 truncate">-</div>
            </div>

            <!-- Water Status -->
            <div class="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-xs text-sky-700 font-medium mb-1">
                    <span>🥛 물주기</span>
                    <i class="fa-solid fa-glass-water opacity-40"></i>
                </div>
                <div id="status-water-time" class="text-sm font-bold text-slate-800 truncate">기록 없음</div>
                <div id="status-water-user" class="text-[11px] text-slate-400 mt-1 truncate">-</div>
            </div>

            <!-- Litter Status -->
            <div class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-xs text-emerald-700 font-medium mb-1">
                    <span>🧹 화장실</span>
                    <i class="fa-solid fa-broom opacity-40"></i>
                </div>
                <div id="status-litter-time" class="text-sm font-bold text-slate-800 truncate">기록 없음</div>
                <div id="status-litter-user" class="text-[11px] text-slate-400 mt-1 truncate">-</div>
            </div>
        </section>

        <!-- Main Action Buttons -->
        <section class="mb-6 space-y-3">
            <h2 class="text-sm font-semibold text-slate-500 px-1 flex items-center justify-between">
                <span>빠른 케어 기록하기</span>
                <span id="active-user-badge" class="text-xs text-rose-500 font-normal">현재 선택: 다혜</span>
            </h2>

            <!-- Feed Button -->
            <button onclick="handleQuickAdd('밥주기')" class="btn-bounce w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white p-4 rounded-2xl shadow-md hover:shadow-lg flex items-center justify-between group active:scale-[0.98]">
                <div class="flex items-center gap-3.5">
                    <div class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-2xl">
                        🍚
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-lg leading-tight">밥주기 완료</div>
                        <div class="text-xs text-amber-100 mt-0.5">사료/간식을 챙겨줬어요</div>
                    </div>
                </div>
                <span class="bg-white/20 px-3 py-1.5 rounded-xl text-xs font-semibold backdrop-blur-sm group-hover:bg-white group-hover:text-amber-600 transition-all">
                    기록하기 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                </span>
            </button>

            <!-- Water Button -->
            <button onclick="handleQuickAdd('물주기')" class="btn-bounce w-full bg-gradient-to-r from-sky-500 to-blue-500 text-white p-4 rounded-2xl shadow-md hover:shadow-lg flex items-center justify-between group active:scale-[0.98]">
                <div class="flex items-center gap-3.5">
                    <div class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-2xl">
                        🥛
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-lg leading-tight">물 주기 완료</div>
                        <div class="text-xs text-sky-100 mt-0.5">깨끗한 새 물로 갈아줬어요</div>
                    </div>
                </div>
                <span class="bg-white/20 px-3 py-1.5 rounded-xl text-xs font-semibold backdrop-blur-sm group-hover:bg-white group-hover:text-sky-600 transition-all">
                    기록하기 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                </span>
            </button>

            <!-- Litter Box Button -->
            <button onclick="handleQuickAdd('화장실청소')" class="btn-bounce w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-4 rounded-2xl shadow-md hover:shadow-lg flex items-center justify-between group active:scale-[0.98]">
                <div class="flex items-center gap-3.5">
                    <div class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-2xl">
                        🧹
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-lg leading-tight">화장실 청소 완료</div>
                        <div class="text-xs text-emerald-100 mt-0.5">감자/맛동산을 감형했어요</div>
                    </div>
                </div>
                <span class="bg-white/20 px-3 py-1.5 rounded-xl text-xs font-semibold backdrop-blur-sm group-hover:bg-white group-hover:text-emerald-700 transition-all">
                    기록하기 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                </span>
            </button>
        </section>

        <!-- Log Filter & History List -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-cat-500"></i> 돌봄 히스토리
                </h3>
                <span id="total-count-badge" class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
                    총 0건
                </span>
            </div>

            <!-- Filters -->
            <div class="flex items-center gap-1.5 mb-4 overflow-x-auto pb-1 text-xs">
                <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-xl font-medium transition-all bg-slate-800 text-white">전체</button>
                <button onclick="setFilter('밥주기')" id="filter-feed" class="px-3 py-1.5 rounded-xl font-medium transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">🍚 밥</button>
                <button onclick="setFilter('물주기')" id="filter-water" class="px-3 py-1.5 rounded-xl font-medium transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">🥛 물</button>
                <button onclick="setFilter('화장실청소')" id="filter-litter" class="px-3 py-1.5 rounded-xl font-medium transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">🧹 화장실</button>
            </div>

            <!-- History Timeline Container -->
            <div id="history-container" class="space-y-3 min-h-[160px]">
                <div class="text-center py-12 text-slate-400 text-sm">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-cat-400"></i>
                    <p>기록을 불러오는 중입니다...</p>
                </div>
            </div>
        </section>

    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl transform transition-all">
            <div class="flex items-center justify-between mb-4">
                <h4 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-cat-500"></i> 기록 수정하기
                </h4>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="edit-form" onsubmit="handleSaveEdit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">

                <!-- Type Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">항목 선택</label>
                    <select id="edit-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-cat-400 font-medium">
                        <option value="밥주기">🍚 밥주기 완료</option>
                        <option value="물주기">🥛 물 주기 완료</option>
                        <option value="화장실청소">🧹 화장실 청소 완료</option>
                    </select>
                </div>

                <!-- Person Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">담당자</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 cursor-pointer text-sm font-semibold hover:bg-rose-50 has-[:checked]:bg-rose-50 has-[:checked]:border-rose-300 has-[:checked]:text-rose-600">
                            <input type="radio" name="edit-user" value="다혜" class="hidden">
                            <span>👩‍🦰 다혜</span>
                        </label>
                        <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 cursor-pointer text-sm font-semibold hover:bg-sky-50 has-[:checked]:bg-sky-50 has-[:checked]:border-sky-300 has-[:checked]:text-sky-600">
                            <input type="radio" name="edit-user" value="대준" class="hidden">
                            <span>👨‍🦱 대준</span>
                        </label>
                    </div>
                </div>

                <!-- Date & Time Picker -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">시간 수정</label>
                    <input type="datetime-local" id="edit-datetime" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-cat-400 font-medium">
                </div>

                <!-- Optional Note -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">메모 (선택)</label>
                    <input type="text" id="edit-note" placeholder="예: 습식 사료 반개, 전체 모래갈이 등" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-cat-400">
                </div>

                <!-- Modal Actions -->
                <div class="flex items-center gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="flex-1 py-3 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">
                        취소
                    </button>
                    <button type="submit" class="flex-1 py-3 text-sm font-semibold text-white bg-cat-500 hover:bg-cat-600 rounded-xl shadow-md">
                        수정 저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl text-center">
            <div class="w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h4 class="font-bold text-slate-800 text-lg mb-1">기록 삭제</h4>
            <p class="text-xs text-slate-500 mb-5">이 돌봄 기록을 삭제하시겠습니까?<br>삭제된 항목은 복구할 수 없습니다.</p>
            
            <input type="hidden" id="delete-id">
            
            <div class="flex items-center gap-2">
                <button onclick="closeDeleteModal()" class="flex-1 py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">
                    취소
                </button>
                <button onclick="confirmDeleteLog()" class="flex-1 py-2.5 text-sm font-semibold text-white bg-rose-500 hover:bg-rose-600 rounded-xl shadow-md">
                    삭제하기
                </button>
            </div>
        </div>
    </div>

    <!-- Quick Note Modal (Optional note upon quick add) -->
    <div id="quick-note-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl">
            <div class="text-center mb-4">
                <span id="quick-modal-icon" class="text-4xl block mb-1">🍚</span>
                <h4 id="quick-modal-title" class="font-bold text-slate-800 text-lg">밥주기 기록 완료!</h4>
                <p class="text-xs text-slate-500 mt-0.5" id="quick-modal-subtitle">다혜님이 기록을 남깁니다.</p>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">간단한 메모 추가 (선택사항)</label>
                <input type="text" id="quick-note-input" placeholder="예: 닭가슴살 츄르, 수돗물 교체" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-cat-400">
                
                <!-- Quick tags -->
                <div class="flex flex-wrap gap-1.5 mt-2.5" id="quick-tags-container">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="skipQuickNote()" class="flex-1 py-3 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">
                    메모 없이 저장
                </button>
                <button onclick="submitQuickNote()" class="flex-1 py-3 text-sm font-semibold text-white bg-cat-500 hover:bg-cat-600 rounded-xl shadow-md">
                    저장하기
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-full max-w-xs px-4"></div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Application Context
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-care-dahye-daejoon';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                // Fallback default config if outside environment
                apiKey: "AIzaSyDummyKeyForDemoPurposesOnly",
                authDomain: "cat-care-tracker.firebaseapp.com",
                projectId: "cat-care-tracker",
                storageBucket: "cat-care-tracker.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef123456"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Management
        window.state = {
            currentUser: '다혜', // Default user
            logs: [],
            filter: 'all',
            pendingType: null
        };

        // Initialize Authentication
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                setupRealtimeListener();
            } catch (err) {
                console.error("Auth failed:", err);
                showToast("인증 서버에 연결할 수 없습니다.", "error");
            }
        }

        function setupRealtimeListener() {
            // Path following Rule 1: /artifacts/{appId}/public/data/{collectionName}
            const logsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'cat_care_logs');

            onSnapshot(logsCollection, (snapshot) => {
                const logsData = [];
                snapshot.forEach((documentDoc) => {
                    logsData.push({
                        id: documentDoc.id,
                        ...documentDoc.data()
                    });
                });

                // Rule 2: Sort locally in memory (Timestamp descending)
                logsData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                window.state.logs = logsData;
                renderUI();
            }, (error) => {
                console.error("Firestore listener error:", error);
                document.getElementById('connection-status').className = "flex items-center gap-1.5 text-xs text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-100";
                document.getElementById('connection-status').innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>오프라인 연동 중</span>`;
            });
        }

        // Add Log Entry
        window.addCareLog = async function(type, note = '') {
            try {
                const now = new Date();
                const newEntry = {
                    type: type, // '밥주기', '물주기', '화장실청소'
                    userName: window.state.currentUser,
                    timestamp: now.getTime(),
                    dateStr: now.toISOString(),
                    note: note.trim()
                };

                const logsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'cat_care_logs');
                await addDoc(logsCollection, newEntry);
                showToast(`${type} 완료! (${window.state.currentUser})`, 'success');
            } catch (error) {
                console.error("Error adding document:", error);
                showToast("기록 저장 중 오류가 발생했습니다.", "error");
            }
        };

        // Update Log Entry
        window.updateCareLog = async function(id, updatedData) {
            try {
                const logDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cat_care_logs', id);
                await updateDoc(logDocRef, updatedData);
                showToast("기록이 성공적으로 수정되었습니다.", "success");
            } catch (error) {
                console.error("Error updating document:", error);
                showToast("수정에 실패했습니다.", "error");
            }
        };

        // Delete Log Entry
        window.deleteCareLog = async function(id) {
            try {
                const logDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cat_care_logs', id);
                await deleteDoc(logDocRef);
                showToast("기록이 삭제되었습니다.", "info");
            } catch (error) {
                console.error("Error deleting document:", error);
                showToast("삭제 중 오류가 발생했습니다.", "error");
            }
        };

        // Start App
        initAuth();
    </script>

    <!-- UI Logic & Interaction Handlers -->
    <script>

        // User Selector
        function selectUser(userName) {
            window.state.currentUser = userName;
            const dahyeBtn = document.getElementById('btn-user-dahye');
            const daejoonBtn = document.getElementById('btn-user-daejoon');
            const badge = document.getElementById('active-user-badge');

            if (userName === '다혜') {
                dahyeBtn.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 shadow-sm bg-white text-rose-600 font-bold border border-rose-100";
                daejoonBtn.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 text-slate-500 hover:text-slate-700";
                badge.innerText = "현재 선택: 다혜 👩‍🦰";
                badge.className = "text-xs text-rose-500 font-semibold";
            } else {
                daejoonBtn.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 shadow-sm bg-white text-sky-600 font-bold border border-sky-100";
                dahyeBtn.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 text-slate-500 hover:text-slate-700";
                badge.innerText = "현재 선택: 대준 👨‍🦱";
                badge.className = "text-xs text-sky-600 font-semibold";
            }
        }

        // Quick Add Trigger
        function handleQuickAdd(type) {
            window.state.pendingType = type;
            const modal = document.getElementById('quick-note-modal');
            const iconEl = document.getElementById('quick-modal-icon');
            const titleEl = document.getElementById('quick-modal-title');
            const subtitleEl = document.getElementById('quick-modal-subtitle');
            const tagsContainer = document.getElementById('quick-tags-container');
            const noteInput = document.getElementById('quick-note-input');

            noteInput.value = '';

            let icon = '🍚';
            let title = '밥주기 완료!';
            let tags = ['건식 사료', '습식 사료', '츄르 간식', '유산균'];

            if (type === '물주기') {
                icon = '🥛';
                title = '물 주기 완료!';
                tags = ['정수기 세척', '새 수돗물', '얼음물', '위치 이동'];
            } else if (type === '화장실청소') {
                icon = '🧹';
                title = '화장실 청소 완료!';
                tags = ['감자/맛동산', '모래 전체갈이', '모래 보충', '소독 청소'];
            }

            iconEl.innerText = icon;
            titleEl.innerText = title;
            subtitleEl.innerText = `${window.state.currentUser}님이 케어 기록을 남깁니다.`;

            // Render tag suggestions
            tagsContainer.innerHTML = tags.map(tag => 
                `<button type="button" onclick="appendTag('${tag}')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-medium transition-colors">
                    + ${tag}
                </button>`
            ).join('');

            modal.classList.remove('hidden');
            setTimeout(() => noteInput.focus(), 100);
        }

        function appendTag(tagText) {
            const input = document.getElementById('quick-note-input');
            if (input.value) {
                input.value += `, ${tagText}`;
            } else {
                input.value = tagText;
            }
        }

        function skipQuickNote() {
            if (window.state.pendingType) {
                window.addCareLog(window.state.pendingType, '');
            }
            closeQuickNoteModal();
        }

        function submitQuickNote() {
            const note = document.getElementById('quick-note-input').value;
            if (window.state.pendingType) {
                window.addCareLog(window.state.pendingType, note);
            }
            closeQuickNoteModal();
        }

        function closeQuickNoteModal() {
            document.getElementById('quick-note-modal').classList.add('hidden');
            window.state.pendingType = null;
        }

        // Filters
        function setFilter(type) {
            window.state.filter = type;
            
            const btnAll = document.getElementById('filter-all');
            const btnFeed = document.getElementById('filter-feed');
            const btnWater = document.getElementById('filter-water');
            const btnLitter = document.getElementById('filter-litter');

            const activeClass = "px-3 py-1.5 rounded-xl font-medium transition-all bg-slate-800 text-white shadow-sm";
            const inactiveClass = "px-3 py-1.5 rounded-xl font-medium transition-all bg-slate-100 text-slate-600 hover:bg-slate-200";

            btnAll.className = type === 'all' ? activeClass : inactiveClass;
            btnFeed.className = type === '밥주기' ? activeClass : inactiveClass;
            btnWater.className = type === '물주기' ? activeClass : inactiveClass;
            btnLitter.className = type === '화장실청소' ? activeClass : inactiveClass;

            renderUI();
        }

        // Relative Time Formatter
        function formatTimeAgo(timestamp) {
            if (!timestamp) return '기록 없음';
            const now = new Date().getTime();
            const diffSeconds = Math.floor((now - timestamp) / 1000);

            if (diffSeconds < 60) return '방금 전';
            const diffMinutes = Math.floor(diffSeconds / 60);
            if (diffMinutes < 60) return `${diffMinutes}분 전`;
            const diffHours = Math.floor(diffMinutes / 60);
            if (diffHours < 24) return `${diffHours}시간 전`;
            const diffDays = Math.floor(diffHours / 24);
            if (diffDays < 7) return `${diffDays}일 전`;

            const date = new Date(timestamp);
            return `${date.getMonth() + 1}월 ${date.getDate()}일`;
        }

        // Full DateTime Formatter
        function formatFullDateTime(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            const month = d.getMonth() + 1;
            const date = d.getDate();
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const day = dayNames[d.getDay()];
            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? '오후' : '오전';
            hours = hours % 12 || 12;

            return `${month}월 ${date}일(${day}) ${ampm} ${hours}:${minutes}`;
        }

        // Convert Timestamp to HTML datetime-local string
        function toDatetimeLocalString(timestamp) {
            const date = timestamp ? new Date(timestamp) : new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        // Main Render Function
        function renderUI() {
            const logs = window.state.logs || [];

            // 1. Update Top Summary Cards
            const latestFeed = logs.find(l => l.type === '밥주기');
            const latestWater = logs.find(l => l.type === '물주기');
            const latestLitter = logs.find(l => l.type === '화장실청소');

            // Feed status card
            if (latestFeed) {
                document.getElementById('status-feed-time').innerText = formatTimeAgo(latestFeed.timestamp);
                document.getElementById('status-feed-user').innerHTML = `by <span class="font-semibold text-slate-600">${latestFeed.userName}</span> (${formatFullDateTime(latestFeed.timestamp).split(' ').slice(-2).join(' ')})`;
            } else {
                document.getElementById('status-feed-time').innerText = '기록 없음';
                document.getElementById('status-feed-user').innerText = '-';
            }

            // Water status card
            if (latestWater) {
                document.getElementById('status-water-time').innerText = formatTimeAgo(latestWater.timestamp);
                document.getElementById('status-water-user').innerHTML = `by <span class="font-semibold text-slate-600">${latestWater.userName}</span> (${formatFullDateTime(latestWater.timestamp).split(' ').slice(-2).join(' ')})`;
            } else {
                document.getElementById('status-water-time').innerText = '기록 없음';
                document.getElementById('status-water-user').innerText = '-';
            }

            // Litter status card
            if (latestLitter) {
                document.getElementById('status-litter-time').innerText = formatTimeAgo(latestLitter.timestamp);
                document.getElementById('status-litter-user').innerHTML = `by <span class="font-semibold text-slate-600">${latestLitter.userName}</span> (${formatFullDateTime(latestLitter.timestamp).split(' ').slice(-2).join(' ')})`;
            } else {
                document.getElementById('status-litter-time').innerText = '기록 없음';
                document.getElementById('status-litter-user').innerText = '-';
            }

            // 2. Filter Logs
            const filteredLogs = window.state.filter === 'all' 
                ? logs 
                : logs.filter(l => l.type === window.state.filter);

            document.getElementById('total-count-badge').innerText = `총 ${filteredLogs.length}건`;

            // 3. Render Timeline List
            const container = document.getElementById('history-container');

            if (filteredLogs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <i class="fa-solid fa-cat text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">아직 등록된 돌봄 기록이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">상단의 버튼을 눌러 첫 기록을 남겨보세요!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredLogs.map(log => {
                let badgeBg = 'bg-amber-50 text-amber-700 border-amber-200';
                let icon = '🍚';
                let typeText = '밥주기 완료';

                if (log.type === '물주기') {
                    badgeBg = 'bg-sky-50 text-sky-700 border-sky-200';
                    icon = '🥛';
                    typeText = '물 주기 완료';
                } else if (log.type === '화장실청소') {
                    badgeBg = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                    icon = '🧹';
                    typeText = '화장실 청소';
                }

                const userBadge = log.userName === '다혜' 
                    ? '<span class="text-[11px] font-semibold bg-rose-50 text-rose-600 px-2 py-0.5 rounded-md border border-rose-100">👩‍🦰 다혜</span>'
                    : '<span class="text-[11px] font-semibold bg-sky-50 text-sky-600 px-2 py-0.5 rounded-md border border-sky-100">👨‍🦱 대준</span>';

                return `
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100/80 rounded-2xl border border-slate-100 transition-colors group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-xl shadow-sm border border-slate-100">
                                ${icon}
                            </div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-sm text-slate-800">${typeText}</span>
                                    ${userBadge}
                                </div>
                                <div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
                                    <span>${formatFullDateTime(log.timestamp)}</span>
                                    <span class="text-[10px] bg-white px-1.5 py-0.5 rounded border border-slate-200 text-slate-500 font-medium">${formatTimeAgo(log.timestamp)}</span>
                                </div>
                                ${log.note ? `<div class="text-xs text-slate-600 mt-1 bg-white px-2.5 py-1 rounded-lg border border-slate-200/60 inline-block">💬 ${escapeHtml(log.note)}</div>` : ''}
                            </div>
                        </div>

                        <!-- Edit / Delete Actions -->
                        <div class="flex items-center gap-1 opacity-90">
                            <button onclick="openEditModal('${log.id}')" title="수정" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-white rounded-xl transition-all">
                                <i class="fa-solid fa-pencil text-xs"></i>
                            </button>
                            <button onclick="openDeleteModal('${log.id}')" title="삭제" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-white rounded-xl transition-all">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        // Edit Modal Open
        function openEditModal(logId) {
            const log = window.state.logs.find(l => l.id === logId);
            if (!log) return;

            document.getElementById('edit-id').value = log.id;
            document.getElementById('edit-type').value = log.type;
            
            // Set radio button for user
            const userRadios = document.getElementsByName('edit-user');
            for (let radio of userRadios) {
                if (radio.value === log.userName) {
                    radio.checked = true;
                }
            }

            document.getElementById('edit-datetime').value = toDatetimeLocalString(log.timestamp);
            document.getElementById('edit-note').value = log.note || '';

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        // Submit Edit Form
        function handleSaveEdit(event) {
            event.preventDefault();
            const id = document.getElementById('edit-id').value;
            const type = document.getElementById('edit-type').value;
            
            let userName = '다혜';
            const userRadios = document.getElementsByName('edit-user');
            for (let radio of userRadios) {
                if (radio.checked) userName = radio.value;
            }

            const datetimeVal = document.getElementById('edit-datetime').value;
            const timestamp = datetimeVal ? new Date(datetimeVal).getTime() : new Date().getTime();
            const note = document.getElementById('edit-note').value.trim();

            window.updateCareLog(id, {
                type: type,
                userName: userName,
                timestamp: timestamp,
                dateStr: new Date(timestamp).toISOString(),
                note: note
            });

            closeEditModal();
        }

        // Delete Modal Open
        function openDeleteModal(logId) {
            document.getElementById('delete-id').value = logId;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.add('hidden');
        }

        function confirmDeleteLog() {
            const id = document.getElementById('delete-id').value;
            if (id) {
                window.deleteCareLog(id);
            }
            closeDeleteModal();
        }

        // Toast Notification Function
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgClass = 'bg-slate-800 text-white';
            let icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';

            if (type === 'error') {
                bgClass = 'bg-rose-600 text-white';
                icon = '<i class="fa-solid fa-circle-exclamation text-white"></i>';
            } else if (type === 'info') {
                bgClass = 'bg-slate-800 text-white';
                icon = '<i class="fa-solid fa-circle-info text-sky-400"></i>';
            }

            toast.className = `${bgClass} shadow-xl rounded-2xl px-4 py-3 text-xs font-semibold flex items-center gap-2.5 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto border border-white/10`;
            toast.innerHTML = `${icon} <span>${escapeHtml(message)}</span>`;

            container.appendChild(toast);

            // Animate In
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            // Animate Out & Remove
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 2500);
        }
    </script>
